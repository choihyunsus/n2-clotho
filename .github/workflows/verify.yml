name: Verify compiler release
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
      CARGO_BUILD_JOBS: 2
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: rustup toolchain install 1.98.0 --profile minimal
      - run: cargo test --locked --manifest-path compiler/Cargo.toml
      - run: cargo build --locked --manifest-path compiler/Cargo.toml --bin n2-compiler
      - run: npm ci --prefix mcp
      - run: npm test --prefix mcp
      - run: npm audit --prefix mcp --omit=dev --audit-level=low
      - run: npm pack --dry-run
        working-directory: mcp
